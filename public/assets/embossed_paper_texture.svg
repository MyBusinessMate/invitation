<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <filter id="embossed-paper" x="0%" y="0%" width="100%" height="100%">
    <!-- High quality fine paper fibers -->
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
    <feDiffuseLighting in="noise" lighting-color="#FFFDF9" surfaceScale="2.2" result="light">
      <feDistantLight azimuth="55" elevation="45" />
    </feDiffuseLighting>
    <feBlend mode="multiply" in="SourceGraphic" in2="light" />
  </filter>
  <rect width="100%" height="100%" fill="#F8E9DD" filter="url(#embossed-paper)" />
</svg>
